<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17232D">
<title>Product | LoneWolf Clothing.co</title>
<link rel="icon" href="wolf-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="lw-header"></div>
<main>
  <div class="container" id="pdp-root"></div>
  <section class="section tight" id="reviews-sec" hidden>
    <div class="container">
      <div class="section-head left"><span class="eyebrow">Reviews</span><h2 style="font-size:2rem">What people say</h2><p>Reviews you add here are saved in this browser only. The first one is a labelled sample.</p></div>
      <div class="grid-2" style="align-items:start">
        <div id="review-list" style="display:grid;gap:16px"></div>
        <form id="review-form" class="form-card" style="max-width:none;margin:0" novalidate>
          <h3 style="margin-bottom:16px">Write a review</h3>
          <div class="form-field"><label for="r-name">Name</label><input id="r-name" required maxlength="60"></div>
          <div class="form-field"><label>Rating</label><div class="star-rating" id="r-stars" role="radiogroup" aria-label="Rating"></div></div>
          <div class="form-field"><label for="r-msg">Your review</label><textarea id="r-msg" required maxlength="600" style="min-height:100px"></textarea></div>
          <div class="field-error" id="r-err" role="alert"></div>
          <button class="btn btn-tertiary" type="submit">Post review</button>
        </form>
      </div>
    </div>
  </section>
  <section class="section tight" id="related-sec" hidden><div class="container"><div class="section-head left"><span class="eyebrow">Pair it with</span><h2 style="font-size:2rem">You may also like</h2></div><div class="product-grid" id="related"></div></div></section>
  <section class="section tight" id="recent-sec" hidden><div class="container"><div class="section-head left"><span class="eyebrow">Your trail</span><h2 style="font-size:2rem">Recently viewed</h2></div><div class="product-grid" id="recent"></div></div></section>
</main>
<div id="lw-footer"></div>
<script src="products.js"></script>
<script src="site.js"></script>
<script>
(function(){
  var L = window.LW, $ = L.$, esc = L.esc;
  var id = new URLSearchParams(location.search).get("id");
  var p = L.byId(id);
  var root = $("#pdp-root");
  if (!p) {
    document.title = "Product not found | LoneWolf Clothing.co";
    root.innerHTML = '<div class="empty" style="padding:110px 0"><h3>We couldn\'t find that piece</h3><p>It may have moved on. Browse the collection instead.</p><a class="btn btn-primary" style="margin-top:18px" href="shop.html">Shop all</a></div>';
    return;
  }
  document.title = p.name + " | LoneWolf Clothing.co";

  /* recently viewed */
  var recent = L.read("lonewolf-recent-v1", []).filter(function(x){ return x !== p.id && L.byId(x); });
  var nextRecent = [p.id].concat(recent).slice(0, 6); L.write("lonewolf-recent-v1", nextRecent);

  var tag = p.was ? '<span class="p-tag sale">Sale</span>' : (p.badge ? '<span class="p-tag">'+esc(p.badge)+'</span>' : "");
  root.innerHTML =
    '<nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <a href="shop.html?cat='+encodeURIComponent(p.category)+'">'+esc(p.category)+'</a> / '+esc(p.name)+'</nav>' +
    '<div class="pdp"><div class="gallery"><div class="thumbs" id="thumbs">' + p.images.map(function(src,i){ return '<button type="button" data-i="'+i+'" aria-label="View image '+(i+1)+'" aria-current="'+(i===0)+'"><img src="'+esc(src)+'" alt=""></button>'; }).join("") + '</div>' +
    '<div class="main-img">'+tag+'<img id="main-img" src="'+esc(p.images[0])+'" alt="'+esc(p.name)+'"></div></div>' +
    '<div><span class="eyebrow">'+esc(p.category)+'</span><h1>'+esc(p.name)+'</h1>' +
    '<div class="price-row" style="padding:0"><span class="price">'+L.money(p.price)+'</span>'+(p.was?'<span class="was">'+L.money(p.was)+'</span>':'')+'</div>' +
    '<p class="pdp-desc">'+esc(p.description)+'</p>' + L.pickerHTML(p) +
    '<button class="btn btn-outline btn-block" type="button" id="pdp-wish" data-wish-id="'+p.id+'" aria-pressed="false" style="margin-bottom:6px"></button>' +
    '<div class="perks"><div><b>Free delivery</b>On orders over R1,000</div><div><b>30-day returns</b>Original condition</div><div><b>Relaxed fit</b>Size down for closer</div></div>' +
    '<div class="acc"><details open><summary>Details</summary><ul>'+p.details.map(function(d){return '<li>'+esc(d)+'</li>';}).join("")+'</ul></details>' +
    '<details><summary>Fabric &amp; care</summary><p><b>'+esc(p.fabric)+'</b> '+esc(p.care)+'</p></details>' +
    '<details><summary>Delivery &amp; returns</summary><p>'+esc(p.delivery)+'</p></details></div>' +
    '<p style="font-size:.8rem;color:var(--muted);margin-top:14px">Product photography shows one colourway. Sample catalogue for this demo store.</p></div></div>';

  var thumbs = $("#thumbs");
  thumbs.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b) return;
    $("#main-img").src = p.images[+b.dataset.i];
    Array.prototype.forEach.call(thumbs.children, function(t){ t.setAttribute("aria-current", String(t===b)); });
  });
  L.mountPicker($(".picker", root), p, {});
  /* wishlist label */
  function wishLabel(){ var on = L.wish.has(p.id); var b = $("#pdp-wish"); b.textContent = on ? "♥ Saved to wishlist" : "♡ Save to wishlist"; }
  wishLabel(); document.addEventListener("lw:update", wishLabel);

  /* reviews */
  $("#reviews-sec").hidden = false;
  var RKEY = "lonewolf-reviews-" + p.id;
  var sample = [{ name: "Demo sample", rating: 5, message: "Sample review: comfortable fit and a confident look. Replace with real feedback once the store goes live.", sample: true }];
  function stars(n){ return "★".repeat(n) + "☆".repeat(5-n); }
  function renderReviews(){
    var all = sample.concat(L.read(RKEY, []));
    $("#review-list").innerHTML = all.map(function(r){
      return '<div class="card" style="padding:22px"><div class="stars" aria-label="'+r.rating+' out of 5">'+stars(r.rating)+'</div><p style="margin:8px 0 12px">'+esc(r.message)+'</p><div class="row-between"><b>'+esc(r.name)+'</b>'+(r.sample?'<span class="sample-label">Sample</span>':'')+'</div></div>';
    }).join("");
  }
  renderReviews();
  var rating = 5;
  function paintStars(){ $("#r-stars").innerHTML = [1,2,3,4,5].map(function(n){ return '<button type="button" class="star-btn'+(n<=rating?' active':'')+'" data-v="'+n+'" role="radio" aria-checked="'+(n===rating)+'" aria-label="'+n+' star'+(n>1?'s':'')+'">★</button>'; }).join(""); }
  paintStars();
  $("#r-stars").addEventListener("click", function(e){ var b = e.target.closest("[data-v]"); if(b){ rating = +b.dataset.v; paintStars(); } });
  $("#review-form").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("#r-name").value.trim(), msg = $("#r-msg").value.trim();
    if (!name || !msg) { $("#r-err").textContent = "Please add your name and a few words."; return; }
    $("#r-err").textContent = "";
    var list = L.read(RKEY, []); list.push({ name: name, rating: rating, message: msg }); L.write(RKEY, list);
    e.target.reset(); rating = 5; paintStars(); renderReviews(); L.toast("Thanks, your review is saved on this device.");
  });

  /* related + recent */
  var rel = L.P.filter(function(x){ return x.id !== p.id; }).sort(function(a,b){ return (b.category===p.category)-(a.category===p.category); }).slice(0,4);
  $("#related").innerHTML = rel.map(L.cardHTML).join(""); $("#related-sec").hidden = false;
  if (recent.length) { $("#recent").innerHTML = recent.slice(0,4).map(function(x){ return L.cardHTML(L.byId(x)); }).join(""); $("#recent-sec").hidden = false; }
  document.dispatchEvent(new CustomEvent("lw:update"));
})();
</script>
</body>
</html>
